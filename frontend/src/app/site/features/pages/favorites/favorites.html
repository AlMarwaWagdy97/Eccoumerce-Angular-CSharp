<h2 class="section-title">My Favorites</h2>

@if (loading()) {
  <div class="state-message">Loading favorites…</div>
} @else if (favorites().length === 0) {
  <div class="state-message">No favorites yet. Save a product to see it here.</div>
} @else {
  <div class="favorites-grid">
    @for (item of favorites(); track item.id) {
      <article class="favorite-card">
        <button type="button" class="remove-btn" (click)="remove(item)" [disabled]="removingId() === item.id" aria-label="Remove from favorites">
          <i class="bi bi-x-lg"></i>
        </button>
        <h3>{{ item.productTitle }}</h3>
        <p class="favorite-price">{{ item.price | currency }}</p>
        <a [routerLink]="['/products', item.slug]" class="view-link">View product</a>
      </article>
    }
  </div>
}
