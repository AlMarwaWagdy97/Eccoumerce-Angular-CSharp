<div class="home-page" style="margin-top: 80px;">

   <app-hero></app-hero>

   <app-category-slider> </app-category-slider>


    <section class="products-section container mb-5 py-3">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="fw-bold m-0">Featured Products</h2>
                <p class="text-muted small m-0">Handpicked favorites just for you</p>
            </div>
            <a routerLink="/products" class="text-dark fw-medium text-decoration-none small d-flex align-items-center gap-1">View All
                <i class="bi bi-arrow-right"></i></a>
        </div>

        <div class="row row-cols-1 row-cols-md-2 row-cols-lg-4 g-4">
            @for (product of featured(); track product.id) {
                <div class="col">
                    <app-product-card [product]="product" />
                </div>
            } @empty {
                <div class="col-12">
                    <p class="text-muted text-center py-4 m-0">No products available yet.</p>
                </div>
            }
        </div>
    </section>

    <section class="arrivals-section container mb-5 py-3">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="fw-bold m-0">New Arrivals</h2>
                <p class="text-muted small m-0">Fresh additions to our collection</p>
            </div>
            <a routerLink="/products" class="text-dark fw-medium text-decoration-none small d-flex align-items-center gap-1">View All
                <i class="bi bi-arrow-right"></i></a>
        </div>

        <div class="row row-cols-1 row-cols-md-2 row-cols-lg-4 g-4">
            @for (product of newArrivals(); track product.id) {
                <div class="col">
                    <app-product-card [product]="product" />
                </div>
            }
        </div>
    </section>

</div>
