<div class="shop-page" style="margin-top: 90px;">
  <div class="container py-4">

    <div class="mb-4">
      <h1 class="fw-bold h2 m-0">All Products</h1>
      <p class="text-muted small m-0">{{ filtered().length }} products found</p>
    </div>

    <div class="row g-4">

      <aside class="col-lg-3">
        <div class="filter-sidebar p-3 bg-white rounded-3">

          <div class="filter-group mb-4">
            <h6 class="fw-bold text-dark mb-3">Categories</h6>
            <div class="d-flex flex-column gap-2">

              <label class="d-flex justify-content-between align-items-center filter-option small cursor-pointer">
                <div class="d-flex align-items-center gap-2">
                  <input type="radio" name="categoryFilter" class="form-check-input border-secondary"
                         [checked]="selectedCategoryId() === null" (change)="selectCategory(null)">
                  <span>All</span>
                </div>
                <span class="text-muted fs-7">({{ products().length }})</span>
              </label>

              @for (cat of categories(); track cat.id) {
                <label class="d-flex justify-content-between align-items-center filter-option small cursor-pointer">
                  <div class="d-flex align-items-center gap-2">
                    <input type="radio" name="categoryFilter" class="form-check-input border-secondary"
                           [checked]="selectedCategoryId() === cat.id" (change)="selectCategory(cat.id)">
                    <span>{{ cat.title }}</span>
                  </div>
                  <span class="text-muted fs-7">({{ countFor(cat.id) }})</span>
                </label>
              }
            </div>
          </div>

          <div class="filter-group">
            <h6 class="fw-bold text-dark mb-3">Price Range</h6>
            <div class="d-flex align-items-center gap-2">
              <input type="number" class="form-control form-control-sm bg-light border-0 py-2 rounded-2 text-center"
                     placeholder="0" (input)="onMinPrice($any($event.target).value)">
              <span class="text-muted small">-</span>
              <input type="number" class="form-control form-control-sm bg-light border-0 py-2 rounded-2 text-center"
                     placeholder="500" (input)="onMaxPrice($any($event.target).value)">
            </div>
          </div>

        </div>
      </aside>

      <main class="col-lg-9">

        <div class="d-flex justify-content-between align-items-center mb-4 bg-white p-2 rounded-3 shadow-sm border border-light">
          <div class="d-flex align-items-center gap-2">
            <span class="text-muted small text-nowrap">Sort by:</span>
            <select class="form-select form-select-sm border-light bg-light rounded-2 fw-medium" style="width: 160px;"
                    (change)="onSort($any($event.target).value)">
              <option value="featured" selected>Featured</option>
              <option value="price-asc">Price: Low to High</option>
              <option value="price-desc">Price: High to Low</option>
              <option value="newest">Newest Arrivals</option>
            </select>
          </div>

          <div class="d-flex gap-1">
            <button class="btn btn-light btn-sm rounded-2 border-0 p-2 active"><i class="bi bi-grid-3x3-gap-fill fs-6 text-dark"></i></button>
            <button class="btn btn-light btn-sm rounded-2 border-0 p-2"><i class="bi bi-list-task fs-6 text-secondary"></i></button>
          </div>
        </div>

        @if (loading()) {
          <div class="text-center py-5">
            <div class="spinner-border text-teal" role="status"><span class="visually-hidden">Loading...</span></div>
          </div>
        } @else {
          <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
            @for (product of filtered(); track product.id) {
              <div class="col">
                <app-product-card [product]="product" />
              </div>
            } @empty {
              <div class="col-12">
                <p class="text-muted text-center py-5 m-0">No products match your filters.</p>
              </div>
            }
          </div>
        }
      </main>

    </div>
  </div>
</div>
