<section class="categories-section container mb-5 py-3">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="fw-bold m-0">Shop by Category</h2>
                <p class="text-muted small m-0">Browse our curated collections</p>
            </div>
            <a href="#" class="text-dark fw-medium text-decoration-none small d-flex align-items-center gap-1">View All
                <i class="bi bi-arrow-right"></i></a>
        </div>
    @if (categoriesList | async; as cats) {
        <div class="row row-cols-2 row-cols-md-3 row-cols-lg-6 g-3">
            @for(category of cats;track $index){
                <div class="col">
                    <div class="category-card position-relative rounded-4 overflow-hidden h-100 shadow-sm text-white d-flex align-items-end p-3"
                        [style.background-image]="'linear-gradient(transparent, rgba(0,0,0,0.8)), url(' + ((category.image | resolveImageUrl) || 'https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=600') + ')'"
                        style="height: 180px; background-size: cover;">
                        <div>
                            <h6 class="fw-bold m-0"> {{category.title}} </h6>
                            <small class="opacity-75 fs-7">3 Products</small>
                        </div>
                    </div>
                </div>
            }
           
        </div>
    }
</section>
